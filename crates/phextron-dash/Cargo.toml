[package]
name = "phextron-dash"
version = "0.1.0"
edition = "2021"
description = "Phextron dashboards — one shell, one panel per domain (ranch nodes, Jenkins instances, video pipelines, cloud AI projects, all phexts), each panel fed by its own live-source reader."
license = "MIT"

[[bin]]
name = "phextron"
path = "src/main.rs"

[dependencies]
libphext = "0.6.6"
serde_json = "1"
