<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Phextron — the Exocortex console</title>
<script>
  // Theme resolves before paint: stored choice > OS preference > light.
  (function () {
    var choice = "system";
    try { choice = localStorage.getItem("phextron.theme") || "system"; } catch (e) {}
    var dark = choice === "dark" ||
      (choice === "system" && window.matchMedia &&
       window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    document.documentElement.dataset.themeChoice = choice;
  })();
</script>
<style>
  :root {
    --paper: #f7f5ef; --ink: #23211a; --muted: #6d675a; --line: #ddd7c8;
    --card: #fffdf7; --accent: #3c46c8; --ok: #1e7d3a; --warn: #a86a00;
    --bad: #b03030; --hold: #7a4fa3;
  }
  html[data-theme="dark"] {
    --paper: #1a1915; --ink: #eae7db; --muted: #a49d8b; --line: #3a382e;
    --card: #23221c; --accent: #969ae9; --ok: #6fce8b; --warn: #e0aa4e;
    --bad: #ef8a8a; --hold: #c39be8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 16px 22px 10px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 22px; margin: 0; letter-spacing: .14em; }
  header .sub { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  button {
    background: var(--card); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 13px;
  }
  button:hover { border-color: var(--accent); }
  nav { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 22px 0; }
  nav button[aria-selected="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  main { padding: 16px 22px 30px; max-width: 1180px; }
  .src { color: var(--muted); font-size: 12.5px; margin: 2px 0 14px; }
  .src b { color: var(--ink); font-weight: 600; }
  .banner {
    background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--accent);
    border-radius: 6px; padding: 10px 14px; margin-bottom: 14px;
  }
  .banner .coord { color: var(--muted); font-size: 12px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 3px 12px; font-size: 13px;
  }
  .chip b { font-size: 15px; }
  table { border-collapse: collapse; width: 100%; background: var(--card); }
  th, td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; font-size: 13.5px; }
  th { color: var(--muted); font-weight: 600; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .st { font-weight: 600; white-space: nowrap; }
  .st-up { color: var(--ok); } .st-down { color: var(--bad); }
  .st-no-access { color: var(--warn); } .st-thermal-hold { color: var(--hold); }
  .st-not-in-pull { color: var(--muted); }
  .st-SUCCESS { color: var(--ok); } .st-FAILURE { color: var(--bad); }
  .st-UNSTABLE { color: var(--warn); } .st-BUILDING { color: var(--accent); }
  .st-ABORTED, .st-NOT_BUILT, .st-DISABLED { color: var(--muted); }
  .st-online { color: var(--ok); } .st-offline { color: var(--bad); }
  .st-held { color: var(--warn); }
  .st-gap { color: var(--warn); font-weight: 600; }
  .st-present { color: var(--ok); } .st-missing { color: var(--bad); }
  .st-checked { color: var(--ok); } .st-not-checked { color: var(--bad); }
  .st-unavailable { color: var(--warn); }
  .st-idle, .st-reservoir, .st-rolling, .st-exempt, .st-na { color: var(--muted); }
  .st-serving { color: var(--ok); } .st-installing { color: var(--accent); }
  .st-blocked { color: var(--bad); } .st-unrecorded { color: var(--muted); }
  td code { font-size: 12.5px; user-select: all; }
  .copybtn { padding: 1px 7px; font-size: 11.5px; margin-left: 6px; }
  .sub-note { color: var(--muted); font-size: 12px; }
  tr.detail td:first-child { padding-left: 30px; }
  tr.gap td { background: var(--paper); }
  .top { color: var(--muted); font-size: 12px; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    padding: 14px 16px; max-width: 720px;
  }
  .card h2 { margin: 0 0 6px; font-size: 16px; }
  .badge {
    display: inline-block; font-size: 11px; border: 1px solid var(--line);
    border-radius: 4px; padding: 1px 6px; color: var(--muted); margin-left: 8px;
    vertical-align: middle; text-transform: uppercase; letter-spacing: .06em;
  }
  footer { padding: 0 22px 20px; color: var(--muted); font-size: 12.5px; }
  .err { color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>PHEXTRON</h1>
  <span class="sub">the Exocortex console — every panel reads its live source directly</span>
  <span class="spacer"></span>
  <button id="refreshBtn" type="button">Refresh</button>
  <button id="themeBtn" type="button">Theme: System</button>
</header>
<nav id="tabs" aria-label="Dashboards"></nav>
<main id="panel"><p class="src">Loading…</p></main>
<footer>
  Phextron · panels read live machine-readable sources only — never rendered pages.
  Serving-layer auth per the console rulings: Desktop SSO for humans, MCP Auth for agents.
</footer>
<script>
  var PANELS = [], current = "nodes";

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function num(v, suffix) {
    if (v === null || v === undefined) return "—";
    return esc(v) + (suffix || "");
  }

  function renderNodes(d) {
    var b = d.body, out = "";
    out += '<p class="src">Source: <b>' + esc(d.source.name) + '</b> · ' +
           esc(d.source.location) + '<br>Freshness: ' + esc(d.source.freshness) + '</p>';
    if (b.distilled) {
      out += '<div class="banner"><div>' + esc(b.distilled.summary) + '</div>' +
             '<div class="coord">state.phext · newest distilled entry ' + esc(b.distilled.ts) +
             ' · register: ' + esc(b.distilled.scrolls) + ' scrolls, ' + esc(b.distilled.entries) +
             ' entries · ' + esc(b.distilled.register_age) + '</div></div>';
    }
    var order = ["up", "thermal-hold", "no-access", "down", "not-in-pull"];
    out += '<div class="chips"><span class="chip">roster <b>' + esc(b.roster_count) + '</b></span>';
    order.forEach(function (k) {
      if (b.counts[k]) out += '<span class="chip">' + esc(k) + ' <b>' + esc(b.counts[k]) + '</b></span>';
    });
    out += '</div>';
    out += '<table><thead><tr><th>Node</th><th>Status</th><th>Load</th><th>Cores</th>' +
           '<th>Tctl °C</th><th>GPU °C</th><th>Ollama</th><th>Render</th><th>Gateway</th><th>Top</th></tr></thead><tbody>';
    b.rows.forEach(function (r) {
      var per = (r.load !== null && r.ncpu) ? " (" + (r.load / r.ncpu).toFixed(2) + "/core)" : "";
      out += '<tr><td><b>' + esc(r.display) + '</b>' +
             (r.enabled ? "" : ' <span class="badge">disabled</span>') +
             '<br><span class="top">' + esc(r.ip) + '</span></td>' +
             '<td class="st st-' + esc(r.status) + '">' + esc(r.status) + '</td>' +
             '<td class="num">' + num(r.load) + per + '</td>' +
             '<td class="num">' + num(r.ncpu) + '</td>' +
             '<td class="num">' + num(r.tctl_c) + '</td>' +
             '<td class="num">' + num(r.gpu_c) + '</td>' +
             '<td>' + esc(r.ollama || "—") + '</td>' +
             '<td>' + esc(r.render || "—") + '</td>' +
             '<td>' + esc(r.gateway || "—") + '</td>' +
             '<td class="top" title="' + esc(r.top) + '">' + esc(r.top || "") + '</td></tr>';
    });
    out += '</tbody></table>';
    return out;
  }

  function renderJenkins(d) {
    var b = d.body, c = b.controller, out = "";
    out += '<p class="src">Source: <b>' + esc(d.source.name) + '</b> · ' +
           esc(d.source.location) + '<br>Freshness: ' + esc(d.source.freshness) + '</p>';
    out += '<div class="banner"><div>Controller: <b>Jenkins ' + esc(c.version || "—") +
           '</b> · mode ' + esc(c.mode || "—") +
           (c.quieting_down ? ' · <b>quieting down</b>' : '') +
           (c.reading_as ? ' · reading as ' + esc(c.reading_as) : '') +
           '</div><div class="coord">one controller exists today — the ranch nodes are its agents; per-node Jenkins servers are the fleet plan, not the present fact</div></div>';
    var cnt = b.counts || {};
    out += '<div class="chips"><span class="chip">jobs <b>' + esc(b.jobs.length) + '</b></span>';
    ["SUCCESS", "FAILURE", "UNSTABLE", "BUILDING", "NOT_BUILT"].forEach(function (k) {
      if (cnt[k]) out += '<span class="chip">' + esc(k.toLowerCase().replace("_", " ")) + ' <b>' + esc(cnt[k]) + '</b></span>';
    });
    out += '<span class="chip">agents online <b>' + esc(b.agents_summary.online) + '/' + esc(b.agents_summary.total) + '</b></span>' +
           '<span class="chip">executors busy <b>' + num(b.agents_summary.executors_busy) + '/' + num(b.agents_summary.executors_total) + '</b></span>' +
           '<span class="chip">queue <b>' + esc(b.queue.length) + '</b></span></div>';
    out += '<table><thead><tr><th>Job</th><th>Last build</th><th>Result</th><th>Duration</th><th>Finished</th></tr></thead><tbody>';
    b.jobs.forEach(function (j) {
      out += '<tr><td><b>' + esc(j.name) + '</b>' +
             (j.buildable ? "" : ' <span class="badge">disabled</span>') +
             (j.in_queue ? ' <span class="badge">in queue</span>' : "") + '</td>' +
             '<td class="num">' + (j.last_number === null ? "—" : "#" + esc(j.last_number)) + '</td>' +
             '<td class="st st-' + esc(j.result) + '">' + esc(j.result.replace("_", " ")) + '</td>' +
             '<td class="num">' + esc(j.duration || "—") + '</td>' +
             '<td>' + esc(j.age || "—") + '</td></tr>';
    });
    out += '</tbody></table>';
    out += '<table style="margin-top:14px"><thead><tr><th>Agent</th><th>Status</th><th>Executors</th><th>Load</th><th>Note</th></tr></thead><tbody>';
    b.agents.forEach(function (a) {
      out += '<tr><td><b>' + esc(a.name) + '</b></td>' +
             '<td class="st st-' + esc(a.status_key) + '">' + esc(a.status) + '</td>' +
             '<td class="num">' + esc(a.executors) + '</td>' +
             '<td>' + (a.status_key === "online" ? (a.idle ? "idle" : "busy") : "—") + '</td>' +
             '<td class="top" title="' + esc(a.cause) + '">' + esc(a.cause || "") + '</td></tr>';
    });
    out += '</tbody></table>';
    if (b.queue.length) {
      out += '<div class="card" style="margin-top:14px"><h2>Queue</h2>';
      b.queue.items.forEach(function (q) {
        out += '<p>' + esc(q.job) + ' — ' + esc(q.why) +
               (q.waiting ? ' · waiting ' + esc(q.waiting) : '') + '</p>';
      });
      out += '</div>';
    }
    return out;
  }

  function fmtBytes(n) {
    if (n === null || n === undefined) return "\u2014";
    if (n < 1024) return n + " B";
    var units = ["KB", "MB", "GB", "TB"], v = n, i = -1;
    do { v /= 1024; i++; } while (v >= 1024 && i < units.length - 1);
    return v.toFixed(1) + " " + units[i];
  }

  function renderPhexts(d) {
    var b = d.body, t = b.totals, out = "";
    out += '<p class="src">Source: <b>' + esc(d.source.name) + '</b> \u00b7 ' +
           esc(d.source.location) + '<br>Freshness: ' + esc(d.source.freshness) + '</p>';
    out += '<div class="chips"><span class="chip">phexts <b>' + esc(t.phexts) + '</b></span>' +
           '<span class="chip">total <b>' + esc(fmtBytes(t.bytes)) + '</b></span>' +
           '<span class="chip">scrolls <b>' + esc(t.scrolls) + '</b></span>' +
           '<span class="chip">corpora live <b>' + esc(t.corpora_live) + '/' + esc(t.corpora_total) + '</b></span>';
    if (t.parse_failures) out += '<span class="chip">parse failures <b>' + esc(t.parse_failures) + '</b></span>';
    out += '</div>';
    b.corpora.forEach(function (c) {
      if (c.state === "live") {
        out += '<div class="banner"><div><b>' + esc(c.label) + '</b> \u00b7 ' + esc(c.host) +
               ' \u00b7 ' + esc(c.phexts) + ' phexts \u00b7 ' + esc(fmtBytes(c.bytes)) + ' \u00b7 ' + esc(c.scrolls) + ' scrolls' +
               (c.parse_failures ? ' \u00b7 ' + esc(c.parse_failures) + ' parse failures' : '') +
               '</div><div class="coord">' + esc(c.location) + ' \u00b7 newest file ' + esc(c.newest_age) + '</div></div>';
      } else {
        out += '<div class="card" style="margin-bottom:14px;max-width:none"><h2>' + esc(c.label) +
               '<span class="badge">degraded</span></h2>' +
               '<p class="err">' + esc(c.error) + '</p>' +
               '<p class="coord">' + esc(c.host) + ' \u00b7 ' + esc(c.location) + '</p></div>';
      }
    });
    out += '<table><thead><tr><th>Phext</th><th>Corpus</th><th>Size</th><th>Scrolls</th><th>Updated</th></tr></thead><tbody>';
    b.rows.forEach(function (r) {
      var scrolls = (r.scrolls === null)
        ? '<span class="err" title="' + esc(r.parse_error || "") + '">parse failed</span>'
        : esc(r.scrolls);
      out += '<tr><td><b>' + esc(r.name) + '</b><br><span class="top">' + esc(r.file) + '</span></td>' +
             '<td>' + esc(r.corpus_label) + '</td>' +
             '<td class="num">' + esc(fmtBytes(r.bytes)) + '</td>' +
             '<td class="num">' + scrolls + '</td>' +
             '<td>' + esc(r.age) + '</td></tr>';
    });
    out += '</tbody></table>';
    return out;
  }

  function renderVideo(d) {
    var b = d.body, reg = b.register, q = b.batchq, out = "";
    out += '<p class="src">Source: <b>' + esc(d.source.name) + '</b> · ' +
           esc(d.source.location) + '<br>Freshness: ' + esc(d.source.freshness) + '</p>';
    out += '<div class="chips"><span class="chip">pipelines <b>' + esc(reg.pipelines) + '</b></span>';
    Object.keys(reg.by_kind).forEach(function (k) {
      out += '<span class="chip">' + esc(k) + ' <b>' + esc(reg.by_kind[k]) + '</b></span>';
    });
    out += '<span class="chip">newest activity <b>' + esc(reg.newest_activity) + '</b></span></div>';
    if (q.mode === "degraded") {
      out += '<div class="card" style="margin-bottom:14px;max-width:none"><h2>ranch-batchq' +
             '<span class="badge">degraded</span></h2>' +
             '<p class="err">' + esc(q.error) + '</p>' +
             '<p class="coord">rock-mountain · ~/ranch-batchq</p></div>';
    } else {
      var c = q.counts;
      out += '<div class="banner"><div><b>ranch-batchq</b> · rock-mountain · pending <b>' +
             esc(c.pending) + '</b> · running <b>' + esc(c.running) + '</b> · done <b>' +
             esc(c.done) + '</b> · failed <b>' + esc(c.failed) + '</b> · outputs <b>' +
             esc(c.outputs) + '</b></div>' +
             '<div class="coord">' +
             (q.mode === "live-dir" ? 'queue directories read live at request time' :
              'snapshot captured ' + esc(q.captured_age) + ' — the queue lives on rock-mountain; the snapshot is the read path from this host') +
             (q.status_updated_at ? ' · runner status ' + esc(q.status_updated_at) : '') +
             (q.reason ? ' · ' + esc(q.reason) : '') +
             '</div></div>';
    }
    out += '<table><thead><tr><th>Pipeline</th><th>Kind</th><th>State</th><th>Last activity</th><th>Entry updated</th><th>Source of truth</th></tr></thead><tbody>';
    b.rows.forEach(function (r) {
      out += '<tr><td><b>' + esc(r.name) + '</b><br><span class="top">' + esc(r.coordinate) + '</span></td>' +
             '<td>' + esc(r.kind) + '</td>' +
             '<td>' + esc(r.state) + '</td>' +
             '<td style="white-space:nowrap">' + esc(r.last_activity) + '<br><span class="top">' + esc(r.activity_age) + '</span></td>' +
             '<td style="white-space:nowrap">' + esc(r.updated) + '</td>' +
             '<td class="top" title="' + esc(r.source) + '">' + esc(r.source) + '</td></tr>';
    });
    out += '</tbody></table>';
    return out;
  }

  // Decimal units with two decimals — the same human() the stash
  // register's builder renders, so a size on this panel always matches
  // the figure the register itself prints (fmtBytes above is the
  // phexts panel's binary rendering of its own census).
  function fmtBytes10(n) {
    if (n === null || n === undefined) return "\u2014";
    var units = [["TB", 1e12], ["GB", 1e9], ["MB", 1e6], ["KB", 1e3]];
    for (var i = 0; i < units.length; i++) {
      if (n >= units[i][1]) return (n / units[i][1]).toFixed(2) + " " + units[i][0];
    }
    return n + " B";
  }

  function renderData(d) {
    var b = d.body, r = b.register, out = "";
    out += '<p class="src">Source: <b>' + esc(d.source.name) + '</b> · ' +
           esc(d.source.location) + '<br>Freshness: ' + esc(d.source.freshness) + '</p>';
    out += '<div class="chips"><span class="chip">stashes <b>' + esc(r.stashes_recorded) + '</b></span>' +
           '<span class="chip">measured <b title="' + esc(r.total_measured_bytes) + ' bytes (counted entries only)">' +
           esc(r.total_measured_human) + '</b></span>' +
           '<span class="chip">counted <b>' + esc(r.counted_entries) + '</b></span>' +
           '<span class="chip">detail <b>' + esc(r.detail_entries) + '</b></span>' +
           '<span class="chip">gaps <b>' + esc(r.gap_entries) + '</b></span>' +
           '<span class="chip">census <b>' + esc(r.census_date) + '</b></span></div>';
    out += '<div class="banner"><div><b>stash.phext</b> · the estate stash census · ' +
           esc(r.entries_parsed) + ' entries parsed · sha256 ' + esc(String(r.sha256).slice(0, 12)) +
           '… · snapshot updated ' + esc(r.file_age) + '</div><div class="coord">by kind: ' +
           r.by_kind.map(function (k) { return esc(k.kind) + ' ' + esc(k.count) + ' — ' + esc(k.bytes_human); }).join(' · ') +
           '</div></div>';
    out += '<table><thead><tr><th>Stash</th><th>Kind</th><th>Host</th><th>Size</th><th>Items</th><th>Freshness</th><th>Read method</th><th>Coverage</th></tr></thead><tbody>';
    b.rows.forEach(function (row) {
      var cls = row.gap ? ' class="gap"' : (row.detail ? ' class="detail"' : '');
      var badges = "";
      if (row.detail) badges += '<span class="badge">detail' + (row.parent ? ' of ' + esc(row.parent) : '') + '</span>';
      if (row.gap) badges += '<span class="badge">gap</span>';
      if (row.probe.mode === "live-file" || row.probe.mode === "live-dir") badges += '<span class="badge">live stat</span>';
      if (row.probe.mode === "failed") badges += '<span class="badge">stat failed</span>';
      var size;
      if (row.gap) {
        size = '<span class="st-gap">unmeasured</span>' +
               (row.size_note ? '<br><span class="top">' + esc(row.size_note) + '</span>' : '');
      } else if (row.probe.mode === "live-file" && row.probe.size_bytes !== row.size_bytes) {
        size = esc(fmtBytes10(row.probe.size_bytes)) +
               '<br><span class="top">register: ' + esc(fmtBytes10(row.size_bytes)) + '</span>';
      } else {
        size = '<span title="' + esc(row.size_bytes) + ' bytes">' + esc(fmtBytes10(row.size_bytes)) + '</span>' +
               (row.size_note ? '<br><span class="top">' + esc(row.size_note) + '</span>' : '');
      }
      var fresh = esc(row.freshness);
      if (row.probe.mode === "live-file" || row.probe.mode === "live-dir") {
        fresh += '<br><span class="top">stat ' + esc(row.probe.age) + '</span>';
      }
      out += '<tr' + cls + '><td><b>' + esc(row.name) + '</b>' + badges +
             '<br><span class="top" title="' + esc(row.path) + '">' + esc(row.path) + '</span>' +
             (row.notes ? '<br><span class="top" title="' + esc(row.notes) + '">' + esc(row.notes) + '</span>' : '') +
             '</td>' +
             '<td>' + esc(row.kind) + '</td>' +
             '<td>' + esc(row.host) + '</td>' +
             '<td class="num">' + size + '</td>' +
             '<td>' + esc(row.items || "—") + '</td>' +
             '<td>' + fresh + '</td>' +
             '<td>' + esc(row.read_method) + '</td>' +
             '<td>' + esc(row.coverage) + '</td></tr>';
    });
    out += '</tbody></table>';
    return out;
  }

  function renderSubstrates(d) {
    var b = d.body, s = b.summary, r = b.checks_register, out = "";
    out += '<p class="src">Source: <b>' + esc(d.source.name) + '</b> · ' +
           esc(d.source.location) + '<br>Freshness: ' + esc(d.source.freshness) + '</p>';
    out += '<div class="chips"><span class="chip">substrates <b>' + esc(b.rows.length) + '</b></span>' +
           '<span class="chip">missing work <b>' + esc(s.missing) + '</b></span>' +
           '<span class="chip">budgets not checked <b>' + esc(s.not_checked) + '</b></span>' +
           '<span class="chip">dispatch sources unavailable <b>' + esc(s.unavailable) + '</b></span>' +
           '<span class="chip">checks recorded <b>' + esc(r.checks_recorded) + '</b></span></div>';
    out += '<table><thead><tr><th>Substrate</th><th>Reset window</th><th>Dispatched work</th><th>Budget checked</th></tr></thead><tbody>';
    b.rows.forEach(function (row) {
      var w = row.window, win;
      if (w.kind === "weekly") {
        win = esc(w.label) + '<div class="sub-note">window opened ' + esc(w.start_local) +
              ' · resets ' + esc(w.next_local) + ' (in ' + esc(w.resets_in) + ')</div>';
      } else {
        win = esc(w.label);
      }
      var disp = '<span class="st st-' + esc(row.dispatch.state) + '">' +
                 esc(row.dispatch.state.replace("_", " ").toUpperCase()) + '</span>' +
                 '<div class="sub-note">' + esc(row.dispatch.detail) + '</div>';
      var bud = row.budget, btxt;
      if (bud.state === "checked") {
        btxt = '<span class="st st-checked">CHECKED</span> ' + esc(bud.checked_local) +
               '<div class="sub-note">' + esc(bud.age) + '</div>';
      } else if (bud.state === "not_checked") {
        btxt = '<span class="st st-not-checked">NOT CHECKED</span>' +
               '<div class="sub-note">no check recorded in the current window</div>';
      } else if (bud.state === "rolling") {
        btxt = '<span class="st st-rolling">ROLLING</span>' +
               (bud.checked_local
                 ? '<div class="sub-note">last check ' + esc(bud.checked_local) + ' · ' + esc(bud.age) + '</div>'
                 : '<div class="sub-note">no check recorded</div>');
      } else if (bud.state === "exempt") {
        btxt = '<span class="st st-exempt">EXEMPT</span>' +
               '<div class="sub-note">context reservoir — no reset window' +
               (bud.checked_local ? ' · last check ' + esc(bud.checked_local) : '') + '</div>';
      } else {
        btxt = '<span class="st st-na">—</span>' +
               '<div class="sub-note">unmetered — no budget check</div>';
      }
      out += '<tr><td><b>' + esc(row.label) + '</b></td><td>' + win + '</td>' +
             '<td>' + disp + '</td><td>' + btxt + '</td></tr>';
    });
    out += '</tbody></table>';
    out += '<p class="src" style="margin-top:10px">A budget check is a recorded event: ' +
           'mark one with <b>tools/mark-substrate-check.py &lt;substrate&gt;</b> in this repo — ' +
           'checks from a previous window never carry over.</p>';
    return out;
  }

  function copyEndpoint(btn) {
    var text = btn.getAttribute("data-ep") || "";
    function done() {
      var old = btn.textContent;
      btn.textContent = "copied";
      setTimeout(function () { btn.textContent = old; }, 1200);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, done);
    } else {
      var ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta); done();
    }
  }

  function renderInkling(d) {
    var b = d.body, s = b.summary, out = "";
    out += '<p class="src">Source: <b>' + esc(d.source.name) + '</b> · ' +
           esc(d.source.location) + '<br>Freshness: ' + esc(d.source.freshness) + '</p>';
    out += '<div class="chips"><span class="chip">nodes <b>' + esc(s.nodes) + '</b></span>' +
           '<span class="chip">serving <b>' + esc(s.serving) + '</b></span>' +
           '<span class="chip">installing <b>' + esc(s.installing) + '</b></span>' +
           '<span class="chip">held <b>' + esc(s.held) + '</b></span>' +
           '<span class="chip">blocked <b>' + esc(s.blocked) + '</b></span>' +
           (s.unrecorded ? '<span class="chip">unrecorded <b>' + esc(s.unrecorded) + '</b></span>' : '') +
           '<span class="chip">state as of <b>' + esc(b.as_of.local || "—") + '</b></span></div>';
    out += '<div class="banner"><div>Every node serves the same OpenAI-compatible API on port ' +
           esc(b.port) + ' — <b>/health</b>, <b>/v1/chat/completions</b>, <b>/v1/models</b>.</div>' +
           '<div class="coord">' + esc(b.caveat) + ':<br><code>' + esc(b.example) + '</code></div></div>';
    out += '<table><thead><tr><th>Node</th><th>Endpoint</th><th>Quant</th><th>Status</th><th>Progress / completion</th><th>Detail</th></tr></thead><tbody>';
    b.rows.forEach(function (r) {
      var ep = r.endpoint
        ? '<code>' + esc(r.endpoint) + '</code>' +
          '<button type="button" class="copybtn" data-ep="' + esc(r.endpoint) +
          '" onclick="copyEndpoint(this)">copy</button>'
        : '<span class="sub-note">no tailnet address on record</span>';
      var prog;
      if (r.status === "serving") {
        prog = 'completed ' + esc(r.completed_local || "—") +
               '<div class="sub-note">EE ' + esc(r.ee) + '</div>';
      } else if (r.status === "installing" && r.percent !== null && r.percent !== undefined) {
        prog = esc(r.percent.toFixed(1)) + '% of the model file';
      } else {
        prog = "—";
      }
      out += '<tr><td><b>' + esc(r.name) + '</b> <span class="sub-note">' + esc(r.initials) +
             ' · ' + esc(r.ram_gb) + ' GB</span>' +
             (r.ip ? '<br><span class="top">' + esc(r.ip) + '</span>' : '') + '</td>' +
             '<td>' + ep + '</td>' +
             '<td>' + esc(r.quant || "—") + '</td>' +
             '<td class="st st-' + esc(r.status) + '">' + esc(r.status.toUpperCase()) + '</td>' +
             '<td>' + prog + '</td>' +
             '<td class="top" title="' + esc(r.detail || "") + '">' + esc(r.detail || "") + '</td></tr>';
    });
    out += '</tbody></table>';
    out += '<p class="src" style="margin-top:10px">Deployment states ride the register, not a live probe: ' +
           'the as-of stamp above is the evidence time of the freshest deployment sweep. ' +
           'Refresh the register from the rollout records with <b>build_inkling_apis_phext.py</b> in ~/workspace/phext.</p>';
    return out;
  }

  function renderRecon(d) {
    return '<p class="src">Source: <b>' + esc(d.source.name) + '</b> · ' +
      esc(d.source.location) + '<br>Freshness: ' + esc(d.source.freshness) + '</p>' +
      '<div class="card"><h2>' + esc(d.title) +
      '<span class="badge">stage ' + esc(d.body.stage) + ' · recon</span></h2>' +
      '<p>' + esc(d.body.needs) + '</p></div>';
  }

  function renderDegraded(d) {
    return '<p class="src">Source: <b>' + esc(d.source.name) + '</b> · ' + esc(d.source.location) + '</p>' +
      '<div class="card"><h2>' + esc(d.title) + '<span class="badge">degraded</span></h2>' +
      '<p class="err">' + esc(d.body.error || d.source.freshness) + '</p></div>';
  }

  function load(id) {
    current = id;
    var tabs = document.querySelectorAll("#tabs button");
    tabs.forEach(function (t) { t.setAttribute("aria-selected", t.dataset.id === id ? "true" : "false"); });
    fetch("/api/panels/" + id)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var el = document.getElementById("panel");
        if (d.state === "live" && d.id === "nodes") el.innerHTML = renderNodes(d);
        else if (d.state === "live" && d.id === "jenkins") el.innerHTML = renderJenkins(d);
        else if (d.state === "live" && d.id === "phexts") el.innerHTML = renderPhexts(d);
        else if (d.state === "live" && d.id === "video") el.innerHTML = renderVideo(d);
        else if (d.state === "live" && d.id === "data") el.innerHTML = renderData(d);
        else if (d.state === "live" && d.id === "substrates") el.innerHTML = renderSubstrates(d);
        else if (d.state === "live" && d.id === "inkling") el.innerHTML = renderInkling(d);
        else if (d.state === "degraded") el.innerHTML = renderDegraded(d);
        else el.innerHTML = renderRecon(d);
      })
      .catch(function (e) {
        document.getElementById("panel").innerHTML =
          '<p class="err">Panel failed to load: ' + esc(e.message) + '</p>';
      });
  }

  fetch("/api/panels")
    .then(function (r) { return r.json(); })
    .then(function (d) {
      PANELS = d.panels;
      var nav = document.getElementById("tabs");
      PANELS.forEach(function (p) {
        var b = document.createElement("button");
        b.type = "button"; b.textContent = p.title; b.dataset.id = p.id;
        b.setAttribute("aria-selected", p.id === current ? "true" : "false");
        b.addEventListener("click", function () { load(p.id); });
        nav.appendChild(b);
      });
      load(current);
    });

  document.getElementById("refreshBtn").addEventListener("click", function () { load(current); });

  var themeBtn = document.getElementById("themeBtn");
  function themeLabel() {
    var c = document.documentElement.dataset.themeChoice || "system";
    themeBtn.textContent = "Theme: " + c.charAt(0).toUpperCase() + c.slice(1);
  }
  themeBtn.addEventListener("click", function () {
    var order = ["system", "light", "dark"];
    var c = document.documentElement.dataset.themeChoice || "system";
    var next = order[(order.indexOf(c) + 1) % order.length];
    try { localStorage.setItem("phextron.theme", next); } catch (e) {}
    var dark = next === "dark" ||
      (next === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    document.documentElement.dataset.themeChoice = next;
    themeLabel();
  });
  themeLabel();
</script>
</body>
</html>
