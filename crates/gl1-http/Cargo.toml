[package]
name = "gl1-http"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Phextron G-L1: lineage HTTP+TLS client for phext-lattice (ureq + rustls, mirroring phext-lattice's own Cargo.toml choices)"

[dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
